version: 2

build:
  os: ubuntu-24.04
  apt_packages:
    - ffmpeg  # docs/make_animations.py encodes the animations
  tools:
    python: "3.13"
  jobs:
    post_checkout:
      - git fetch --unshallow || true
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --group docs
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv run --group docs plotly_get_chrome -y  # for kaleido
    build:
      html:
        # The animations are not version controlled; render them while the notebooks run.
        - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv run --group docs python docs/make_animations.py & UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv run --group docs python docs/build_notebooks.py && wait $!
        - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv run --group docs zensical build --strict
        - mkdir -p "${READTHEDOCS_OUTPUT}/html"
        - cp -r _site/. "${READTHEDOCS_OUTPUT}/html/"
